:root{
  --marine:#1E293B; --akzent:#3B82F6; --warn:#D97706; --rot:#E11D48; --grau:#64748B;
  --linie:#E2E8F0; --bg:#F8FAFC; --flaeche:rgba(255,255,255,.85);
  --shadow:0 20px 40px -15px rgba(15,23,42,.08);
  --font:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
:root.dunkel{
  --marine:#F1F5F9; --warn:#F59E0B; --rot:#FB7185; --grau:#94A3B8;
  --linie:#334155; --bg:#0F172A; --flaeche:rgba(30,41,59,.85);
  --shadow:0 20px 40px -15px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}

body{
  margin:0; background:var(--bg); color:var(--marine); font-family:var(--font);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(12px,2.5vh,32px);
  padding:clamp(16px,3vw,40px) clamp(16px,3vw,40px) calc(clamp(96px,14vh,150px) + env(safe-area-inset-bottom,0px));
  -webkit-font-smoothing:antialiased; overflow:hidden;
  transition:background .4s ease, color .4s ease;
}
body.ruhe{cursor:none}

/* ---------- Hintergrund-Glow ---------- */
body::before{
  content:''; position:fixed; width:40vw; height:40vw; max-width:500px; max-height:500px;
  background:radial-gradient(circle, rgba(59,130,246,.08) 0%, transparent 70%);
  top:50%; left:50%; transform:translate(-50%,-50%); z-index:0; pointer-events:none;
  transition:background .5s ease;
}
body.warnung::before{background:radial-gradient(circle, rgba(217,119,6,.1) 0%, transparent 70%)}
body.aus::before{background:radial-gradient(circle, rgba(225,29,72,.12) 0%, transparent 70%)}

/* ---------- Arbeitsauftrag ---------- */
.auftrag{
  position:relative; z-index:2; margin:0; max-width:min(92vw,42ch); min-width:8ch;
  font-size:clamp(18px,2.6vw,40px); font-weight:700; line-height:1.25; text-align:center;
  color:var(--marine); padding:6px 16px; border-radius:14px; outline:none; cursor:text;
  overflow-wrap:anywhere; transition:background .2s ease;
}
.auftrag:hover,.auftrag:focus{background:color-mix(in srgb, var(--grau) 9%, transparent)}
.auftrag:focus-visible{outline:2px solid var(--marine); outline-offset:3px}
.auftrag:empty{font-size:clamp(15px,1.6vw,22px)}
.auftrag:empty::before{content:attr(data-platzhalter); color:var(--grau); font-weight:600; opacity:.75}
body.laeuft .auftrag:empty, body.pause .auftrag:empty, body.aus .auftrag:empty{display:none}
body.ruhe .auftrag{background:none}

/* ---------- Zahl ---------- */
.zahl{
  position:relative; z-index:1; margin:0; cursor:pointer; user-select:none; -webkit-user-select:none;
  font-size:clamp(6rem,26vw,26rem); font-weight:800; line-height:.82;
  letter-spacing:.02em; font-variant-numeric:tabular-nums; color:var(--marine);
  transition:color .4s ease, opacity .3s ease, transform .2s ease;
}
.zahl:active{transform:scale(.98)}
body.mit-auftrag .zahl{font-size:clamp(5rem,21vw,21rem)}
body.warnung .zahl{color:var(--warn)}
body.aus .zahl{color:var(--rot); animation:softBlink 1.2s ease-in-out infinite}
@keyframes softBlink{0%,100%{opacity:1} 50%{opacity:.25}}
body.pause .zahl{opacity:.35}

/* ---------- Endzeit ---------- */
.endzeit{
  position:relative; z-index:1; margin:0; min-height:1.4em;
  font-size:clamp(14px,1.7vw,24px); font-weight:600; color:var(--grau);
  font-variant-numeric:tabular-nums;
}

/* ---------- Hinweis ---------- */
.hinweis{
  position:relative; z-index:1; margin:0; font-size:clamp(13px,1.3vw,16px); font-weight:600;
  color:var(--grau); text-align:center; max-width:70ch;
  background:color-mix(in srgb, var(--grau) 8%, transparent); padding:8px 18px; border-radius:20px;
  transition:opacity .3s ease;
}
body.laeuft .hinweis, body.pause .hinweis, body.aus .hinweis{display:none}
kbd{font:inherit; color:var(--marine)}
@media (hover:none){ .hinweis{display:none} }

/* ---------- Fortschrittsbalken ---------- */
.balken{
  position:fixed; left:0; bottom:0; height:8px; width:100%;
  background:var(--linie); opacity:0; transition:opacity .3s ease; z-index:10;
}
body.laeuft .balken, body.pause .balken, body.aus .balken{opacity:1}
.balken i{
  display:block; height:100%; width:100%; transform-origin:left center; transform:scaleX(0);
  background:linear-gradient(90deg, var(--akzent), var(--marine)); transition:background .4s ease;
}
body.warnung .balken i{background:linear-gradient(90deg, #F59E0B, var(--warn))}
body.aus .balken i{background:linear-gradient(90deg, #F43F5E, var(--rot))}

/* ---------- Bedienleiste ---------- */
.leiste{
  position:fixed; left:0; right:0; margin-inline:auto; width:fit-content;
  bottom:calc(clamp(20px,3.5vh,38px) + env(safe-area-inset-bottom,0px));
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center;
  padding:10px 14px; border-radius:20px; background:var(--flaeche);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--linie); box-shadow:var(--shadow);
  transition:opacity .35s ease, transform .35s ease; max-width:min(96vw,1200px); z-index:20;
}
body.ruhe .leiste{opacity:0; transform:translateY(16px); pointer-events:none}

.leiste button{
  font-family:inherit; font-weight:700; font-size:clamp(16px,1.8vw,22px); color:var(--marine);
  background:transparent; border:1px solid transparent; border-radius:12px;
  min-width:clamp(52px,5.6vw,72px); min-height:clamp(48px,5.5vw,58px); padding:0 14px;
  cursor:pointer; transition:background .15s ease, color .15s ease, transform .15s ease;
  font-variant-numeric:tabular-nums;
}
.leiste button:hover{background:color-mix(in srgb, var(--marine) 8%, transparent); transform:translateY(-1px)}
.leiste button:active{transform:translateY(0)}
.leiste button.neben{font-size:clamp(13px,1.3vw,16px); font-weight:600; color:var(--grau); min-width:auto}
.leiste button.neben:hover{color:var(--marine)}

.leiste button.icon{min-width:clamp(48px,5vw,56px); padding:0; display:inline-grid; place-items:center; color:var(--grau)}
.leiste button.icon:hover{color:var(--marine)}
.leiste button.icon svg{width:22px; height:22px}
#btnTon[aria-pressed="false"] .an{display:none}
#btnTon[aria-pressed="true"] .stumm{display:none}
#btnDunkel[aria-pressed="true"]{color:var(--marine)}

.leiste input{
  font:inherit; font-weight:700; font-size:clamp(16px,1.8vw,22px); color:var(--marine);
  width:5.5em; min-height:clamp(48px,5.5vw,58px); padding:0 12px; text-align:center;
  background:transparent; border:1px solid var(--linie); border-radius:12px;
  font-variant-numeric:tabular-nums;
}
.leiste input::placeholder{color:var(--grau); font-weight:600}

.gruppe{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center}
.gruppe[hidden], button[hidden]{display:none}
.trenner{width:1px; align-self:stretch; background:var(--linie); margin:6px 2px}

.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

:focus-visible{outline:2px solid var(--marine); outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
@media (max-width:560px){ .leiste{gap:6px; padding:8px} .trenner{display:none} }
</style>
</head>
<body>

<p class="auftrag" id="auftrag" contenteditable="true" spellcheck="false" role="textbox"
   aria-label="Arbeitsauftrag" data-platzhalter="Arbeitsauftrag eintippen (optional)"></p>
<p class="zahl" id="zahl" role="timer" aria-live="off" title="Klick: Start / Pause">0:00</p>
<p class="endzeit" id="endzeit"></p>
<p class="hinweis" id="hinweis">
  Zeit wählen · <kbd>Leertaste</kbd> Start/Pause · <kbd>F</kbd> Vollbild · <kbd>D</kbd> dunkel · <kbd>M</kbd> Ton · <kbd>A</kbd> Auftrag · <kbd>E</kbd> eigene Zeit
</p>
<p class="sr-only" id="ansage" aria-live="assertive"></p>

<div class="balken" aria-hidden="true"><i id="balken"></i></div>

<div class="leiste" id="leiste" role="toolbar" aria-label="Timer-Steuerung">
  <div class="gruppe" id="gruppeStart">
    <span class="gruppe" id="presets"></span>
    <button id="btnEigene" class="neben" aria-expanded="false" aria-controls="gruppeEigene" title="Eigene Zeit (E)">Eigene…</button>
  </div>

  <div class="gruppe" id="gruppeEigene" hidden>
    <input id="eingabe" type="text" inputmode="decimal" autocomplete="off" placeholder="Min"
           aria-label="Minuten, z. B. 7, 2,5 oder 1:30">
    <button id="btnEigeneStart">Start</button>
  </div>

  <div class="gruppe" id="gruppeLauf" hidden>
    <button id="btnPause" aria-label="Timer starten, pausieren oder fortsetzen">Pause</button>
    <button data-plus="-1" aria-label="1 Minute abziehen" title="1 Minute abziehen (−)">−1</button>
    <button data-plus="1" aria-label="1 Minute hinzufügen" title="1 Minute hinzufügen (+)">+1</button>
    <button data-plus="5" aria-label="5 Minuten hinzufügen">+5</button>
    <button id="btnNeu" class="neben" aria-label="Timer zurücksetzen">Neu</button>
  </div>

  <span class="trenner" aria-hidden="true"></span>

  <div class="gruppe" id="gruppeWerkzeug">
    <button id="btnTon" class="icon" aria-pressed="true" aria-label="Ton" title="Ton an/aus (M)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H2v6h4l5 4V5z"/>
        <path class="an" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>
        <path class="stumm" d="m22 9-6 6M16 9l6 6"/>
      </svg>
    </button>
    <button id="btnDunkel" class="icon" aria-pressed="false" aria-label="Dunkelmodus" title="Dunkelmodus (D)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
    <button id="btnVollbild" class="icon" aria-label="Vollbild" title="Vollbild (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
    </button>
  </div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const body = document.body, root = document.documentElement;

const zahlEl = $('zahl'), balkenEl = $('balken'), endzeitEl = $('endzeit'),
      auftragEl = $('auftrag'), ansageEl = $('ansage');
const gStart = $('gruppeStart'), gEigene = $('gruppeEigene'), gLauf = $('gruppeLauf');
const btnPause = $('btnPause'), btnEigene = $('btnEigene'), eingabe = $('eingabe');
const btnTon = $('btnTon'), btnDunkel = $('btnDunkel'), btnVollbild = $('btnVollbild');

const WARNUNG_SEK = 60;           // ab hier orange + Hinweiston
const MAX_SEK = 10 * 3600;        // Obergrenze: 10 Stunden
const params = new URLSearchParams(location.search);


/* ---------- Voreinstellungen (per URL anpassbar: ?presets=5,10,30) ---------- */
let presets = (params.get('presets') || '').split(',')
  .map(s => parseFloat(s.replace(',', '.'))).filter(n => n > 0 && n * 60 <= MAX_SEK).slice(0, 9);
if (!presets.length) presets = [3, 5, 10, 15, 20, 45];
$('presets').innerHTML = presets.map(m => {
  const t = String(m).replace('.', ',');
  return `<button data-min="${m}" aria-label="${t} Minuten starten">${t}</button>`;
}).join('');

/* ---------- Zustand ---------- */
let rest = 0, gesamt = 0, ziel = 0, laeuft = false, ticker = null, wakeLock = null, gewarnt = false;
let tonAn = params.get('ton') !== '0';   // ?ton=0 startet stumm
const pausiert = () => body.classList.contains('pause');
const abgelaufen = () => body.classList.contains('aus');

/* ---------- Hilfsfunktionen ---------- */
function format(sek){
  const s = Math.max(0, Math.ceil(sek));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0');
  return h ? h + ':' + String(m).padStart(2, '0') + ':' + x : m + ':' + x;
}
function uhrzeit(ms){
  return new Date(ms).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}
/* "7" → 7 min · "2,5" → 2:30 · "1:30" → 1 min 30 s */
function parseZeit(s){
  s = String(s || '').trim().replace(',', '.');
  if (!s) return 0;
  let sek;
  if (s.includes(':')){ const [m, x] = s.split(':'); sek = (parseFloat(m) || 0) * 60 + (parseFloat(x) || 0); }
  else sek = parseFloat(s) * 60;
  sek = Math.round(sek);
  return sek > 0 && sek <= MAX_SEK ? sek : 0;
}
function ansagen(text){
  ansageEl.textContent = '';
  setTimeout(() => { ansageEl.textContent = text; }, 50);
}

/* ---------- Anzeige ---------- */
function zeige(){
  const t = format(rest);
  zahlEl.textContent = t;
  document.title = (laeuft || pausiert()) ? t + ' · Unterrichtstimer' : 'Unterrichtstimer';
  balkenEl.style.transform = 'scaleX(' + (gesamt ? Math.min(1, Math.max(0, rest / gesamt)) : 0) + ')';
  body.classList.toggle('warnung', laeuft && rest > 0 && rest <= WARNUNG_SEK && gesamt > WARNUNG_SEK + 15);

  if (laeuft) endzeitEl.textContent = 'Ende um ' + uhrzeit(ziel) + ' Uhr';
  else if (pausiert()) endzeitEl.textContent = rest < gesamt ? 'pausiert' : 'bereit';
  else if (abgelaufen()) endzeitEl.textContent = 'Zeit ist um';
  else endzeitEl.textContent = '';
}

function modus(){
  const inLauf = laeuft || pausiert();
  gStart.hidden = inLauf;
  gLauf.hidden = !inLauf;
  if (inLauf) eigeneZu();
  btnPause.textContent = laeuft ? 'Pause' : (rest >= gesamt ? 'Start' : 'Weiter');
  body.classList.toggle('laeuft', laeuft);
}

/* ---------- Steuerung ---------- */
function start(sek){
  if (sek != null){ rest = sek; gesamt = sek; gewarnt = false; }
  if (rest <= 0) return;
  body.classList.remove('aus', 'pause');
  laeuft = true;
  ziel = Date.now() + rest * 1000;
  clearInterval(ticker);
  ticker = setInterval(tick, 200);
  zeige(); modus(); wach(); aktiv();
}

/* Zeit einstellen, aber noch nicht starten (z. B. per URL-Link) */
function bereit(sek){
  neu();
  rest = gesamt = sek;
  body.classList.add('pause');
  zeige(); modus();
}

function pause(){
  if (!laeuft) return;
  rest = Math.max(0, (ziel - Date.now()) / 1000);
  laeuft = false;
  clearInterval(ticker); ticker = null;
  body.classList.add('pause');
  body.classList.remove('ruhe');
  loslassen(); zeige(); modus();
}

function umschalten(){
  if (laeuft) pause();
  else if (rest > 0) start();
}

function neu(){
  laeuft = false; clearInterval(ticker); ticker = null;
  rest = 0; gesamt = 0; gewarnt = false;
  body.classList.remove('aus', 'pause', 'warnung', 'ruhe');
  loslassen(); zeige(); modus();
}

function verlaengern(min){
  const plus = min * 60;
  if (abgelaufen()){ if (plus > 0) start(plus); return; }
  if (!laeuft && !pausiert()) return;
  if (laeuft){
    ziel = Math.min(Date.now() + MAX_SEK * 1000, Math.max(Date.now() + 1000, ziel + plus * 1000));
    rest = (ziel - Date.now()) / 1000;
  } else {
    rest = Math.min(MAX_SEK, Math.max(1, rest + plus));
  }
  gesamt = Math.max(rest, gesamt + plus);
  if (rest > WARNUNG_SEK) gewarnt = false;
  zeige(); modus();
}

function tick(){
  rest = (ziel - Date.now()) / 1000;
  if (!gewarnt && rest <= WARNUNG_SEK && gesamt > WARNUNG_SEK + 15){
    gewarnt = true; ton(520, 0, .45, .16); ansagen('Noch eine Minute');
  }
  if (rest <= 0){ rest = 0; ende(); return; }
  zeige();
}

function ende(){
  laeuft = false;
  clearInterval(ticker); ticker = null;
  body.classList.remove('pause', 'warnung', 'ruhe');
  body.classList.add('aus');
  loslassen(); zeige(); modus(); gong();
  ansagen('Zeit ist um');
}

/* ---------- Eigene Zeit ---------- */
function eigeneAuf(){
  gEigene.hidden = false;
  btnEigene.setAttribute('aria-expanded', 'true');
  eingabe.focus(); eingabe.select();
}
function eigeneZu(){
  gEigene.hidden = true;
  btnEigene.setAttribute('aria-expanded', 'false');
}
function eigeneStart(){
  const sek = parseZeit(eingabe.value);
  if (!sek){ eingabe.value = ''; eingabe.placeholder = 'z. B. 7'; eingabe.focus(); return; }
  eigeneZu(); eingabe.blur(); start(sek);
}

/* ---------- Ton ---------- */
let ctx = null;
function audioAn(){
  try{
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  }catch(e){}
}
function ton(freq, verzug, dauer, laut){
  if (!tonAn) return;
  audioAn(); if (!ctx) return;
  try{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    const t = ctx.currentTime + verzug;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(laut, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dauer + .05);
  }catch(e){}
}
function gong(){ ton(660, 0, .9, .3); ton(495, .42, .9, .3); ton(396, .84, 1.2, .26); }
function tonUmschalten(){
  tonAn = !tonAn;
  btnTon.setAttribute('aria-pressed', String(tonAn));
  if (tonAn) ton(660, 0, .25, .15);
}

/* ---------- Bildschirm wachhalten ---------- */
async function wach(){
  if (wakeLock || !('wakeLock' in navigator)) return;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  }catch(e){ wakeLock = null; }
}
function loslassen(){
  const w = wakeLock; wakeLock = null;
  try{ w?.release(); }catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && laeuft) wach();
});

/* ---------- Bedienleiste ein-/ausblenden ---------- */
let ruheTimer = null;
function aktiv(){
  body.classList.remove('ruhe');
  clearTimeout(ruheTimer);
  if (laeuft) ruheTimer = setTimeout(() => {
    if (laeuft && !document.activeElement?.closest?.('.leiste, .auftrag')) body.classList.add('ruhe');
  }, 3000);
}
['pointermove', 'pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev =>
  document.addEventListener(ev, () => { audioAn(); aktiv(); }, { passive: true })
);

/* ---------- Darstellung ---------- */
function dunkel(){
  const an = root.classList.toggle('dunkel');
  btnDunkel.setAttribute('aria-pressed', String(an));
}
function vollbild(){
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  if (fs) (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  else (root.requestFullscreen || root.webkitRequestFullscreen)?.call(root);
}

/* ---------- Arbeitsauftrag ---------- */
function auftragPruefen(){
  if (!auftragEl.textContent.trim()) auftragEl.innerHTML = '';
  body.classList.toggle('mit-auftrag', !!auftragEl.textContent.trim());
}
auftragEl.addEventListener('input', auftragPruefen);
auftragEl.addEventListener('blur', auftragPruefen);
auftragEl.addEventListener('paste', (e) => {
  e.preventDefault();
  const text = (e.clipboardData?.getData('text/plain') || '').replace(/\s+/g, ' ').trim();
  if (!document.execCommand?.('insertText', false, text)) auftragEl.textContent += text;
});
auftragEl.addEventListener('drop', (e) => e.preventDefault());
auftragEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === 'Escape'){ e.preventDefault(); auftragEl.blur(); }
});

/* ---------- Ereignisse ---------- */
$('leiste').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.min) start(Math.round(+b.dataset.min * 60));
  else if (b.dataset.plus) verlaengern(+b.dataset.plus);
});
btnPause.addEventListener('click', umschalten);
$('btnNeu').addEventListener('click', neu);
btnEigene.addEventListener('click', () => gEigene.hidden ? eigeneAuf() : eigeneZu());
$('btnEigeneStart').addEventListener('click', eigeneStart);
btnTon.addEventListener('click', tonUmschalten);
btnDunkel.addEventListener('click', dunkel);
btnVollbild.addEventListener('click', vollbild);

zahlEl.addEventListener('click', () => {
  if (abgelaufen()) neu();
  else if (laeuft || rest > 0) umschalten();
  else eigeneAuf();
});

document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t === eingabe){
    if (e.key === 'Enter'){ e.preventDefault(); eigeneStart(); }
    if (e.key === 'Escape'){ eigeneZu(); eingabe.blur(); }
    return;
  }
  if (t.isContentEditable || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') return;
  if (t.tagName === 'BUTTON' && (e.code === 'Space' || e.key === 'Enter')) return; // Knopf selbst auslösen lassen
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  if (e.code === 'Space'){ e.preventDefault(); umschalten(); return; }
  switch (e.key){
    case 'Escape': if (!laeuft) neu(); break;          // läuft der Timer, setzt Esc ihn nicht versehentlich zurück
    case 'f': case 'F': vollbild(); break;
    case 'd': case 'D': dunkel(); break;
    case 'm': case 'M': tonUmschalten(); break;
    case 'a': case 'A': e.preventDefault(); auftragEl.focus(); break;
    case 'e': case 'E': if (!laeuft && !pausiert()){ e.preventDefault(); eigeneAuf(); } break;
    case '+': verlaengern(1); break;
    case '-': verlaengern(-1); break;
    default:
      if (/^[1-9]$/.test(e.key)){ const p = presets[+e.key - 1]; if (p) start(Math.round(p * 60)); }
  }
});

/* ---------- Start ---------- */
btnTon.setAttribute('aria-pressed', String(tonAn));
btnDunkel.setAttribute('aria-pressed', String(root.classList.contains('dunkel')));
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) btnVollbild.hidden = true;

if (params.get('auftrag')) auftragEl.textContent = params.get('auftrag').slice(0, 300);
auftragPruefen();

const urlSek = parseZeit(params.get('min'));
if (urlSek){ params.get('start') === '1' ? start(urlSek) : bereit(urlSek); }
else { zeige(); modus(); }

</script>
</body>
</html>
